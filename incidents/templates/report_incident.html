<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Incident</title>
    <style>
        body{
            margin:0;
            font-family: Arial, sans-serif;
            background:#0f172a;
            color:white;
        }
        .container{
            max-width:500px;
            margin:80px auto;
            background:#1f2937;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.4);
        }
        h1{
            text-align:center;
            color:#38bdf8;
        }
        form{
            display:flex;
            flex-direction:column;
        }
        input, textarea, select{
            width: 100%;
            padding:10px;
            margin:10px 0;
            border:none;
            border-radius:5px;
            box-sizing: border-box;
        }
        button{
            padding:10px;
            background:#38bdf8;
            border:none;
            color:black;
            font-weight:bold;
            cursor:pointer;
            border-radius:5px;
            margin-top:10px;
        }
        button:hover{
            background:#0ea5e9;
        }
        a{
            color:#38bdf8;
            text-align:center;
            display:block;
            margin-top:15px;
            text-decoration:none;
        }
        textarea{vertical-align: top;
        }
        form p{
            margin: 10px 0;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Report Incident</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Submit Report</button>
    </form>
    <a href="/incidents/">View All Incidents</a>
</div>
</body>
</html>
