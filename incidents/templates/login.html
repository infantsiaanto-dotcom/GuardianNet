<!DOCTYPE html>
<html>
<head>
    <title>Login | GuardianNet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: rgba(15, 23, 42, 0.95);
            width: 360px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        h2 {
            margin: 0 0 8px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #111827;
            color: white;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .error {
            color: #f87171;
            font-size: 14px;
            margin-bottom: 12px;
            text-align: center;
        }

        .link {
            display: block;
            margin-top: 14px;
            text-align: center;
            color: #7dd3fc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to continue to GuardianNet</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <a class="link" href="/register/">Create an account</a>
    </div>
</body>
</html>
